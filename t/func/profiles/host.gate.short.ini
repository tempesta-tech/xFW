[pytest]
asyncio_mode = auto
xfail_strict = true
log_level = info
pythonpath = ../
python_files =
    tests/test_always_first_self.py
    tests/test_tcp_auth_filter.py
    tests/test_dst_rule_*
addopts =
    --tb=short
    -s -v
    -rpfsxXpv
    -m 'not clickhouse and not prepare_network and not nic_e1000_warmup and not fail_in_gate_mode and not ddos_simulating'