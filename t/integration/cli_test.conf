# Tempesta FW configuration.
# Comments at the end of line aren't allowed since they require
# sophisticated FSM to analyze string literals, including escaped '"' and
# '''.
tfw {
    srv_group static {
        server 192.168.1.1:8080;
    }
    vhost base {
        proxy_pass static;
    }
    http_chain {
        hdr "Host" == "bar.natsys-lab.com" -> mark = 3;
        -> base;
    }
}

# Tempesta Language (TL).
# TL is compiled to a binary code as is, i.e. if you have a thousand of rules,
# then typically you'll have thousand or more branches in the compiled code.
# From the other side, if you have just a few of the rules, the generated code
# can be faster and the rules syntax is much wider than the maps based.
# Only at XDP (Tempesta xFW) layer for now and gluing XDP layer with HTTP.
tl {
    # Rules (program) for egress traffic on ens3 interface.
    tc /dev == "ens3"/ {
        # `http_chain` is an entry point for Tempesta HTTPtables chains or just
        # a placeholder for XDP standalone logic.
        # The dst rule set is usually small, but if you're managing thousands
        # of services, then use XFW rules.
        ip6.dst == 2001:0db8:85a3:0000:0000:8a2e:0370:7334 && tcp.dst == 80 -> http_chain;
        ip4.dst == 10.10.10.0/24 && udp.src_port == 53 -> block;
    }

    # Rules (program) for ingress traffic on ens4 interface.
    xdp /dev == "ens4:1"/ {
        # Limit IPv4 ICMP type 13 with 3000 packets per second and type 30 with 32KB/s.
        # All other IPv4 ICMP messages are blocked.
        ip4.icmp.type == 13 -> max_packets = 3000;
        ip6.icmp.type == 30 -> max_bytes = 32768;
        ip4.icmp.type == * -> block;

        # Filtration by source addresses, ports and GeoIP.
        # Typically the src rule set can be extremely large, especially with
        # GeoIP. If this is the case, the xfw rules must be used instead.
        ip4.src == 127.0.0.0/8 -> http_chain;
        ip4.tcp.src == 8000 -> block;
    }
}

# Tempesta xFW configuration, general settings
xfw {
    # List of supported IP protocols.
    # Maximum allowed set is {1, 6, 17, 47, 58} (ICMP, TCP, UDP, GRE, ICMPv6).
    # This set can be restricted using the ip_proto filter.
    # If the filter is not specified, the default policy is applied:
    # ip_proto {1, 6, 17, 58}  (GRE is disabled by default)
    ip_proto {1, 6, 17, 47, 58}
    # Enable evaluation mode. Statistics about blocked IPs will be collected,
    # but traffic will not actually be blocked. This mode remains active until
    # the configuration is fully replaced or removed using /del in the patch.
    # Evaluation mode is not compatible with the 'tcp_syncookies' option — you must
    # turn off one of them to successfully apply the configuration.
    evaluation_mode;

    # Configuration of local (protected net) networks. Required for gateway mode.
    # By default this section has name "ip4". You can delete it later with net=ip4/del;
    net ip4 {
        127.0.0.1,
        127.0.0.0/8
    }
    # By default this section has name "ip6". You can delete it later with net=ip6/del;
    net ip6 {
        3001:db8:85a3::8a2e:370:7334/120
    }

    # Stateful filters - no fine grained configuration yet.
    # Switch on tcp_syncookies, DNS filter. Two statements on a line.
    dns_filter; tcp_auth_filter/del;
    
    # Spaces are not allowed around '=' (an opportunity for a further improvement).
    # If one of the timer missed, we use value '0' as default
    tcp_syncookies passive_timer=1 flood_timer=1;

    # Drops packets with unusual TCP flags, missing options, payload in handshake,
    # or seqno=0. 
    # Filter features:
    #   - syn_without_opt → drops packets with SYN that lack TCP options
    #   - syn_with_payload → drops packets with SYN that carry payload
    #   - syn_with_seqno=0 → drops packets with SYN and sequence number = 0
    #   - bad_flags(list) → drops user-specified TCP flag combinations.
    #
    # Behavior of rules with respect to TCP flag lists:
    #   1. No parentheses             → default flags for this feature
    #   2. Empty parentheses ()       → same as default flags
    #   3. Explicit list (e.g., SYN,ACK) → only the listed combinations.
    #
    # If only `tcp_anomaly_filter;` is specified:
    #   - Only RFC-prohibited TCP flag combinations (SYN+FIN, SYN+RST, FIN+RST,
    # and their supersets) are blocked.
    #   - All other packets are allowed, including SYN without options, SYN with
    # payload, or SYN with seqno=0.
    #
    # Notes:
    #   - RFC-prohibited flags are always blocked.
    #   - bad_flags allows the user to extend blocking to additional rare or 
    # suspicious flag combinations.
    #   - No supersets of bad_flags are automatically included — each listed
    # combination is matched exactly.
    tcp_anomaly_filter syn_without_opt syn_with_payload syn_with_seqno=0
                       bad_flags(0,SYN+PSH,SYN+URG,RST+PSH,RST+URG,FIN+PSH+URG);

    # Create a new `src` rule with name "y_white_list1", the same as
    # `src=y_white_list1/replace`. The specified addresses are ratelimited. Others
    # addresses will be processed using other src rules or, if there is no specific
    # rule, then according to the action in the defaults section, specifically
    # 'src_ip ip6.udp;'.
    #
    # The logic is limited in comparison with TL, but an optimized mappings of
    # many ports or addresses are used, so multi-rule filters are handled better.
    # `/del` must not use rate limiters since it's undefined what to do if
    # rate limits don't match to already loaded.
    src=my_white_list1 ip6.udp : ratelimit=whitelist_ratelimit
    # Opening brace can be on a new line.
    {
        1001:0db8:85a3:0000:0000:8a2e:0370:7334/100,
        2001:0db8:85a3:0000:0000:8a2e:0370:7334/110,
    }

    # `/add` and `del` must only contain the name since they adjust existing maps
    # and should not contain actions (allow, block or ratelimit).
    #
    # `add` adds the specified addresses to an existing section with the same name
    # while `replace` replaces the old address set with a new specified one,
    # filtration policies, including the default one, and which ratelimit is used.
    src=my_ratelimited/add ip6.tcp {
        3001:db8:85a3::8a2e:370:7334/120,
        4001:0db8:85a3:0000:0000:8a2e:0370:7334/90
    }

    # Ratelimits are either added or adjusted.
    # The ratelimits are never garbage collected and user must delete them
    # explicitly. There is a limit for 10 rate limits and `add` operation fails
    # if the limit is reached until a user deletes some ratelimits.
    ratelimit=whitelist_ratelimit bps=30000 pps=1000;
    ratelimit=ms_ratelimit bps=40000 pps=2000;
    ratelimit=default_ratelimit pps=5 bps=30000;

    # Default `/replace` action.
    #
    # The sections must have unique names to simplify removal by name instead
    # of full specification like
    #
    #  dst=foo/del ip4.tcp;
    src=my_ratelimited2 ip4.udp : allow {
        10.0.0.0/9,
        1.1.1.1,
	:443,
	:80-88,
    }

    # Delete all src configurations with name `bar` defined in a previous
    # configuration.
    src=bar/del;

    # Delete a `dst` section for ip6.udp with an empty name.
    dst=ip6.udp/del;

    # Syntatic sugar: MaxMind reputation database is just translated into the set
    # of simpe ip.src rules.
    # Single line configuration option.
    # If no ratelimit= ,then it's not rate limited and blocked by default.
    src ip4.tcp { uk, au}
    # Ipv4 and IPv6 addresses from the GeoIP database are distributed among
    # these 2 src rule sets.
    src ip6.tcp { uk, au}

    # Everything in the dst_* sections is ratelimited. Others dst-addresses will
    # be processed using other dst rules or, if there is no specific rule, then
    # according to the action in the defaults section, specifically 'src_ip ip6.udp;'.
    dst=microservice1 ip4.udp : ratelimit=whitelist_ratelimit {
        1.1.1.1:8001,
        127.0.0.1:50
    }

    # Empty configuration is OK to apply (change) the default policy.
    # Essencially with this configuration we replace the previous list for
    # `dst` with the same specification with an empty set and set ratelimit into
    # new value.
    dst=microservice2 ip6.tcp : ratelimit=ms_ratelimit {}

    # It's OK to define many `dst` sections to specify different policies
    # for each of the protected microservice.
    dst=microservice3 ip4.udp : ratelimit=ms_ratelimit {
        192.168.1.10:443,
        192.168.1.10:80
    }

    # TODO has to be removed after #31
    # There are only 2 types of ICMP, identified by IP version, so no need for names.
    # Action can accept: `allow`, `block` or a name of a ratelimiter.
    icmp ip6 : allow {10, 12}

    # Delete icmp configuration for IPv4.
    icmp=ip4/del;

    # Simple ratelimit TCP filter, only RST and SYN segments for now.
    # Rate limit applyed only to tcp segments with named flags.
    # If no ratelimit option then noop.

    # Ratelimit packets with RST(with 'rst') or SYN(with 'syn')
    tcp_flags syn : ratelimit=default_ratelimit;

    # Turn off the tcp_flags rate limiter for packets with the RST (using 'rst')
    # or SYN (using 'syn') flags. If no filter name is specified, the rate limiter
    # for all tcp_flags will be disabled.
    tcp_flags/del rst;

    # Default rules act only if there are explicit rules for the same target
    # (src/dst/src_ports/icmp, etc.). If no explicit rules exist for a target,
    # defaults are considered inactive (no filtering applied). If explicit rules
    # exist for atarget but no default is specified, it is treated as "block".
    # The elements in the default section have no names, as they apply to all
    # named sections listed above that match by attributes.
    defaults {
        # Pseudo-syntax:
        # <target> <scope>: <policy>;
        #
        #   <target>  := src | dst | icmp
        #   <scope>   := ip4[.tcp|.udp] | ip6[.tcp|.udp] | <empty>
        #   <policy>  := allow | block | ratelimit=<name>
        #
        # Allow all incoming IPv4 TCP traffic by default
        src_ip ip4.tcp: allow;
        # Block all incoming IPv4 UDP traffic by default
        src_ip ip4.udp: block;
        # Rate-limit tcp/udp incoming IPv6 traffic using profile "default_ratelimit"
        src_ip ip6: ratelimit = default_ratelimit;

        # Block all incoming IPv4 UDP port traffic by default
        src_port ip4.udp: block;
        # Allow all incoming IPv4 UDP port traffic by default
        src_port ip4.tcp: allow;
        # Allow all incoming IPv6 port traffic by default
        src_port ip6: allow;

	# The dst section can also be expanded similarly to src_ip or src_port:
        # For example, you can specify protocol-specific defaults:
        #
        # dst ip4.tcp: allow;
        # dst ip4.udp: block;
        # dst ip6: ratelimit=default_ratelimit;

        # Block all traffic by default
        dst: block;

        # ICMP traffic can be blocked using the short form: 'icmp block;'
	# Allow all IPv4 traffic by default
        icmp ip4: allow;
        # Block all IPv6 traffic by default
        icmp ip6: block;
    }
}
