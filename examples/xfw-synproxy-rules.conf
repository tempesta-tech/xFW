# Draft gateway rules. Replace documentation addresses with protected networks.
# Start with deployment-mode=gw and synproxy=true in xfw.json.

xfw {
	tcp_synproxy {
		192.0.2.0/24:443
		[2001:db8::]/48:443
		198.51.100.10
	}

	# Keep existing egress classification aware of the protected networks.
	net ip4 { 192.0.2.0/24 198.51.100.10/32 }
	net ip6 { 2001:db8::/48 }
}
